<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true"><style>
.card{fill:#f3f7ee;stroke:#dbe5d3;stroke-width:2}
.c1{fill:#e2ead9}.c2{fill:#c5d9b0}.c3{fill:#8fa085}.c4{fill:#5d6b59}
.acc{fill:#558b2f}.accs{stroke:#7cb342}.sky{fill:#e8f1f6}.sea{fill:#9fd0e0}.sand{fill:#efe2c0}
.lbl{fill:#1c241a;font:700 22px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.win{fill:#f8faef}.floor{fill:#5d6b59}.sun{fill:#ffd36b}
.link{fill:none;stroke:#7cb342;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 9;animation:flow 1.2s linear infinite}
.ring{fill:none;stroke:#7cb342;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.screen{fill:#9ccc65}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.link,.ring{animation:none}.ring{opacity:.5}}
@media (prefers-color-scheme:dark){
 .card{fill:#1d261a;stroke:#2c3a28}
 .c1{fill:#26321f}.c2{fill:#33452a}.c3{fill:#4f5f47}.c4{fill:#8a9a82}
 .sky{fill:#1f2b2e}.sea{fill:#2d5560}.sand{fill:#4a4433}.win{fill:#2f3a29}
 .lbl{fill:#e8efe3}.floor{fill:#151c12}.acc{fill:#9ccc65}
}
